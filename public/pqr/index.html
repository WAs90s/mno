<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/pqr/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PQR - Presenting Quality Retail. A Flutter app for shop owners.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PQR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PQR - Presenting Quality Retail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f3f4f6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #app-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #1f2937;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="app-loading">Loading PQR...</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });

    setTimeout(function () {
      var el = document.getElementById('app-loading');
      if (!el) return;
      el.innerHTML =
        'PQR is taking longer than expected to load.<br><br>' +
        '<a href="javascript:location.reload()">Refresh</a> or clear site data for this domain, then try again.';
      el.style.textAlign = 'center';
      el.style.padding = '24px';
      el.style.maxWidth = '420px';
      el.style.lineHeight = '1.5';
    }, 45000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
